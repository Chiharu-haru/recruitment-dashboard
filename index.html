  // ---------- COST derived ----------
  // 候補者管理表（統合版）/ 旧コスト管理表 の両形式をパースして共通レコードに正規化
  costData(){
    const rows=this.state.cost; if(!rows||rows.length<2) return null;
    const head=rows[0].map(h=>(h||'').trim());
    const ci=(name,exact)=>{ let i=head.indexOf(name); if(i>=0)return i; if(exact)return -1;
      for(let k=0;k<head.length;k++){ if(head[k].indexOf(name)>=0) return k; } return -1; };
    const unified = ci('ABCヨミ',true)>=0 || ci('オファー金額',false)>=0;
    const hd=this.herpRows(); const hById={}; if(hd) hd.forEach(d=>{ hById[d.id]=d; });
    let data;
    if(unified){
      const idx={ id:ci('応募ID'), name:ci('候補者名'), dept:ci('事業部'), job:ci('職種',true), abc:ci('ABCヨミ',true),
        wish:ci('希望年収'), offer:ci('オファー金額'), bonus:ci('一時金'), reward:ci('成果報酬',true),
        join:ci('入社日',true), bill:ci('請求対応'), owner:ci('担当者'), note:ci('備考') };
      data=rows.slice(1).map(r=>{ const id=(r[idx.id]||'').trim(); const hp=hById[id];
        const detail=hp?hp.detail:''; const chRaw=hp?hp.channel:'';
        const wishYen=this.num(r[idx.wish])*10000;
        const offerYen=(idx.offer>=0&&this.num(r[idx.offer]))?this.num(r[idx.offer])*10000:wishYen;
        const rate=this.getRate(detail,id);
        const reward=(idx.reward>=0&&this.num(r[idx.reward]))?this.num(r[idx.reward]):offerYen*rate;
        const join=(r[idx.join]||'').trim();
        return { id, name:(r[idx.name]||'').trim(), dept:(r[idx.dept]||'').trim()||'未設定', job:(r[idx.job]||(hp?hp.job:'')||'').trim(),
          abc:this.normAbc(r[idx.abc]), wishYen, offerYen, costSalary:offerYen||wishYen, reward, bonus:this.num(r[idx.bonus])*10000,
          join, month:this.ym(join), bill:(r[idx.bill]||'').trim(), owner:(r[idx.owner]||'').trim(), note:(r[idx.note]||'').trim(),
          channel:this.normCh(chRaw), channelRaw:chRaw, detail, impact:offerYen/12, status: join?'内定承諾':'選考中' };
      }).filter(d=>d.name||d.id);
    } else {
      const idx={ status:ci('内定承諾',true), salary:ci('年収額（/10000）',true), reward:ci('成果報酬',true),
        offer:ci('オファー総額',true), channel:ci('チャネル',true), detail:ci('チャネル詳細',true),
        dept:ci('Dept',true), cat:ci('カテゴリー',true), name:ci('候補者名',true), job:ci('職種',true), month:ci('入社月',true), impact:ci('月次インパクト',true) };
      if(idx.salary<0) idx.salary=ci('/10000'); if(idx.reward<0) idx.reward=ci('成果報酬');
      data=rows.slice(1).map(r=>{ const ch=(r[idx.channel]||'').trim(); const sy=this.num(r[idx.salary])*10000;
        return { id:'', status:(r[idx.status]||'').trim(), wishYen:sy, costSalary:sy, reward:this.num(r[idx.reward]), offerYen:this.num(r[idx.offer]),
          channel:this.normCh(ch), channelRaw:ch, detail:(r[idx.detail]||'').trim(), abc:'', bonus:0, join:'', bill:'', owner:'', note:'',
          dept:(r[idx.dept]||r[idx.cat]||'').trim()||'未設定', name:(r[idx.name]||'').trim(),
          job:(r[idx.job]||'').trim(), month:this.ym(r[idx.month]), impact:this.num(r[idx.impact]) };
      }).filter(d=>d.name||d.costSalary);
    }
    return data;
  }

    if(ch.indexOf('リファラル')>=0||ch.indexOf('社員紹介')>=0)return 'リファラル'; if(ch.indexOf('媒体')>=0||ch.indexOf('自主応募')>=0)return '媒体自主応募'; return ch.trim()||'その他'; }

                h('div',{className:'tnum',style:{font:'500 12px/16px var(--mono)',color:'var(--gray-600)',marginBottom:3}},Math.round(actual).toLocaleString()+'万'+(bud?(' / '+(ratio*100).toFixed(0)+'%'):'')),
                h('div',{style:{height:6,background:'var(--gray-100)',borderRadius:3,overflow:'hidden'}},h('div',{style:{width:Math.min(ratio*100,100)+'%',height:'100%',background:over?'var(--red-500)':'var(--green-500)',borderRadius:3}}))),
              h('div',{className:'tnum',style:{textAlign:'right',font:'700 13px/1 var(--mono)',color:bud?(over?'var(--red-600)':'var(--green-600)'):'var(--gray-300)'}},bud?((over?'+':'-')+Math.round(Math.abs(actual-bud)).toLocaleString()+'万'):'—'),
              h('button',{onClick:()=>removeDept(d),title:'削除',style:{width:30,height:30,borderRadius:6,border:'1px solid var(--gray-200)',background:'#fff',color:'var(--gray-400)',cursor:'pointer',fontSize:15}},'×')); }),
          h('div',{style:{display:'flex',gap:8,marginTop:8,paddingTop:12,borderTop:'1px solid var(--gray-100)'}},
            h('input',{ref:el=>this._newDept=el,placeholder:'事業部を追加…',style:{flex:1,height:34,padding:'0 10px',border:'1px solid var(--gray-200)',borderRadius:6,font:'400 13px/1 var(--font)',outline:'none'},onKeyDown:e=>{if(e.key==='Enter')addDept();}}),
            h('button',{onClick:addDept,style:{height:34,padding:'0 16px',borderRadius:6,border:0,background:'var(--gray-100)',color:'var(--gray-700)',font:'700 13px/1 var(--font)',cursor:'pointer'}},'＋ 追加')))),

      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}},
        this.card('事業部別 成果報酬','単位：万円',this.barChart(deptChart,{h:230,rotate:true,b:60})),
        this.card('月次 成果報酬推移','入社月ベース・単位：万円',this.lineChart(monthChart,{h:230})),
        this.card('年収分布','内定承諾者・単位：人数',this.barChart(histChart,{h:230,valLabel:true,fmt:v=>Math.round(v),rotate:true,b:50})),
        this.card('事業部別 平均年収','単位：万円',this.barChart(avgDept,{h:230,rotate:true,b:60}))),

      this.card('候補者別コスト明細', acc.length+'名中 '+det.length+'件を表示',
        h('div',{style:{display:'flex',flexDirection:'column',gap:14}},
          h('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}},
            h('div',{style:{flex:'1 1 200px',minWidth:180}},inp(s.costText,v=>this.setState({costText:v}),'名前・事業部・媒体で検索…')),
            sel(s.costChannel,v=>this.setState({costChannel:v}),[['all','全チャネル'],...channels.map(c=>[c,c])]),
            sel(s.costMonth,v=>this.setState({costMonth:v}),[['all','全入社月'],...months.map(m=>[m,m])]),
            h('div',{style:{display:'flex',alignItems:'center',gap:6}},inp(s.costSalMin,v=>this.setState({costSalMin:v}),'年収↓',74),h('span',{style:{color:'var(--gray-400)'}},'〜'),inp(s.costSalMax,v=>this.setState({costSalMax:v}),'年収↑',74),h('span',{style:{font:'400 12px var(--font)',color:'var(--gray-400)'}},'万'))),
          this.miniTable([{label:'候補者'},{label:'事業部',dim:1},{label:'チャネル詳細',dim:1},{label:'年収',num:1},{label:'成果報酬',num:1,bold:1},{label:'オファー総額',num:1,dim:1},{label:'入社月',dim:1}],detRows))));
  }
  /*__END__*/
}
</script>
